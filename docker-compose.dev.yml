services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: sentinel-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis-dev
    ports:
      - "6379:6379"
