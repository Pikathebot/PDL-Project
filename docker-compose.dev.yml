services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: sentinel-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sentinel
    ports:
      # Host port comes from POSTGRES_PORT in .env (compose reads it too), so
      # a machine with a native PostgreSQL on 5432 can move this to 5433 and
      # the backend follows automatically.
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis-dev
    ports:
      - "6379:6379"
