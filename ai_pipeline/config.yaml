# Overridden by AI_PROVIDER in the backend .env when the extractor is built
# from the backend (see ai_pipeline/nlp/extractor.py).
default_provider: llamaserver

providers:
  # llama.cpp llama-server.exe: `llama-server -m <model>.gguf --port 8080 -c 4096`
  llamaserver:
    api_url: http://localhost:8080/v1
    model_name: local-gguf
    temperature: 0.2
    timeout: 120
    # Thinking models (Qwen3 family) otherwise spend the whole budget on
    # hidden reasoning and return empty content. Ignored by non-thinking models.
    extra_body:
      chat_template_kwargs:
        enable_thinking: false

  llamacpp:
    model_path: models/gemma-4-e4b-qat.gguf
    n_ctx: 4096
    n_threads: 6
    n_gpu_layers: -1
    temperature: 0.2

  lmstudio:
    api_url: http://localhost:1234/v1
    model_name: gemma-4-e4b-qat
    temperature: 0.2

  openai:
    api_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model_name: gpt-4o-mini
    temperature: 0.2

verification:
  max_gps_drift_meters: 500.0
  require_turnstile: false

models:
  vision_weights: models/yolov8n.pt
  nlp_model: models/gemma-4-e4b-qat.gguf

